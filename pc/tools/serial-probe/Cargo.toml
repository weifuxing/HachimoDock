[package]
name = "pet-serial-probe"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
libc = "=0.2.185"
serialport = "=4.9.0"
serde_json = "=1.0.149"

[dev-dependencies]
libc = "=0.2.185"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSProcessInfo"] }

[profile.release]
panic = "abort"
