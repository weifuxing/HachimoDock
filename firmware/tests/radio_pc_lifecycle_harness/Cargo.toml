[package]
name = "radio-lifecycle-host"
version = "0.0.0"
edition = "2021"
publish = false

# pytest writes the extracted production branches to this path in its temp crate.
# An explicit target lets CI fetch this crate's dependencies without generating
# or compiling the harness, or resolving the desktop application's dependency tree.
[lib]
path = "generated.rs"

[workspace]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tempfile = "=3.27.0"
